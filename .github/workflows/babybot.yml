# Babybot no GitHub Actions: cada execução fica ~55 minutos rodando o ciclo.py, que a cada
# 5 minutos:
#   1. coloca na FILA as ofertas de bebê novas de Magalu e Amazon, com uma nota de vantagem
#      para o cliente (preço por unidade de fralda/lenço, desconto, cupom)
#   2. renova a lista da Shopee quando estiver acabando e deixa 1 oferta esperando na fila
#   3. publica 1 post: a oferta mais vantajosa (só das 8h às 22h, horário de Brasília)
# No fim, a execução dispara a próxima (corrente contínua) até as 21h30; aí desliga e o
# agendamento religa às 8h.
#
# Para pausar: aba Actions > Babybot > "..." > Disable workflow (e cancele a execução em andamento).
name: Babybot

on:
  workflow_dispatch:
    inputs:
      posts:
        description: "Teste: postar N ofertas da Shopee direto, sem fila (0 = ciclo normal)"
        default: "0"
      intervalo:
        description: "Teste: segundos entre uma oferta e outra"
        default: "60"
  # funciona das 8h00 às 21h30 (Brasília = UTC-3). O agendamento do GitHub costuma atrasar,
  # então liga com 3 tentativas de manhã e tem uma reserva de hora em hora se a corrente parar.
  schedule:
    - cron: "0,20,40 11 * * *"   # 8h00, 8h20 e 8h40: liga o dia
    - cron: "17 12-23 * * *"     # 9h17 às 20h17: reserva
    - cron: "17 0 * * *"         # 21h17: reserva

# só uma execução por vez; a próxima espera (evita posts em dobro)
concurrency:
  group: babybot-producao
  cancel-in-progress: false

permissions:
  contents: write  # salvar a fila e o que foi postado
  actions: write   # disparar a próxima execução

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # segredos: ficam em Settings > Secrets and variables > Actions
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      SHOPEE_FEED_URLS: ${{ secrets.SHOPEE_FEED_URLS }}
      SHOPEE_AFILIADO_ID: "18373760431"
      # variáveis (Settings > Secrets and variables > Actions > Variables): troque lá sem mexer aqui
      SHOPEE_SUB_ID: ${{ vars.SHOPEE_SUB_ID || 'totuxababy' }}
      AMAZON_TAG: ${{ vars.AMAZON_TAG }}
      DESTINO: ${{ vars.DESTINO }}  # canal onde os posts saem (Totuxa Baby)
      # configurações (não são segredo)
      CANAL_ORIGEM: "@parceiromagaludivulgador"
      LOJA_MAGALU: casalbarateiro
      LINK_TEMPLATE: "https://www.magazinevoce.com.br/magazine{loja}/p/{id}/"
      NICHO: baby
      POSTAR_DAS: "8"
      POSTAR_ATE: "22"
      DADOS_DIR: estado
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configurar o Git para salvar o estado
        run: |
          git config user.name "babybot"
          git config user.email "babybot@users.noreply.github.com"

      - name: Ciclo de ~55 minutos (1 post a cada 5 minutos)
        env:
          POSTS: ${{ inputs.posts || '0' }}
          INTERVALO: ${{ inputs.intervalo || '60' }}
        run: |
          if [ "$POSTS" -gt 0 ]; then
            python postar_shopee.py --quantidade "$POSTS" --intervalo "$INTERVALO"
          else
            python ciclo.py --minutos 55 --intervalo 300
          fi

      - name: Disparar a próxima execução (só até 21h30)
        if: ${{ !cancelled() && (inputs.posts || '0') == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          agora=$(TZ=America/Sao_Paulo date +%H%M)
          if [ "$agora" -ge 0800 ] && [ "$agora" -lt 2130 ]; then
            gh workflow run babybot.yml --ref main -R "${{ github.repository }}"
          else
            echo "Passou das 21h30 (agora $agora em Brasília): Babybot desligado até as 8h."
          fi
