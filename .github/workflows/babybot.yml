# Babybot no GitHub Actions: a cada 5 minutos (das 8h às 22h, horário de Brasília)
#   1. Magalu e Amazon: as ofertas de bebê novas nas fontes entram na FILA com uma nota de
#      vantagem para o cliente (preço por unidade de fralda/lenço, desconto, cupom)
#   2. Shopee: renova a lista quando estiver acabando e deixa 1 oferta esperando na fila
#   3. Publica 1 post: a oferta mais vantajosa da fila (as de Magalu/Amazon vencem em 3 h)
# A fila e o que já foi postado ficam em estado/ e voltam para o repositório.
#
# Para pausar: aba Actions > Babybot > "..." > Disable workflow.
name: Babybot

on:
  workflow_dispatch:
    inputs:
      posts:
        description: "Teste: postar N ofertas da Shopee direto, sem fila (0 = rodada normal)"
        default: "0"
      intervalo:
        description: "Teste: segundos entre uma oferta e outra"
        default: "60"
  # repositório público = minutos ilimitados. O GitHub pode atrasar alguns minutos em horários de pico.
  schedule:
    - cron: "*/5 11-23 * * *"   # 8h00 às 20h55
    - cron: "*/5 0 * * *"       # 21h00 às 21h55

# nunca duas rodadas ao mesmo tempo (evita posts em dobro); a seguinte espera na fila
concurrency:
  group: babybot-producao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a rodada normal leva ~1 min; os testes manuais podem levar mais
    env:
      # segredos: ficam em Settings > Secrets and variables > Actions
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      SHOPEE_FEED_URLS: ${{ secrets.SHOPEE_FEED_URLS }}
      SHOPEE_AFILIADO_ID: "18373760431"
      # variáveis (Settings > Secrets and variables > Actions > Variables): troque lá sem mexer aqui
      SHOPEE_SUB_ID: ${{ vars.SHOPEE_SUB_ID || 'totuxababy' }}
      AMAZON_TAG: ${{ vars.AMAZON_TAG }}
      DESTINO: ${{ vars.DESTINO }}  # canal onde os posts saem (Totuxa Baby)
      # configurações (não são segredo)
      CANAL_ORIGEM: "@parceiromagaludivulgador"
      LOJA_MAGALU: casalbarateiro
      LINK_TEMPLATE: "https://www.magazinevoce.com.br/magazine{loja}/p/{id}/"
      NICHO: baby
      POSTAR_DAS: "8"
      POSTAR_ATE: "22"
      DADOS_DIR: estado
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Magalu (ofertas novas para a fila)
        continue-on-error: true
        run: python radar.py --rodada

      - name: Amazon (ofertas novas para a fila)
        continue-on-error: true
        run: python radar_amazon.py --rodada

      - name: Renovar a lista da Shopee (se estiver acabando)
        continue-on-error: true  # se o download falhar, segue com a lista atual
        run: python curadoria_shopee.py --se-faltar 15

      - name: Shopee (1 oferta esperando na fila)
        continue-on-error: true
        run: python postar_shopee.py --fila

      - name: Publicar a oferta mais vantajosa
        env:
          POSTS: ${{ inputs.posts || '0' }}
          INTERVALO: ${{ inputs.intervalo || '60' }}
        run: |
          if [ "$POSTS" -gt 0 ]; then
            python postar_shopee.py --quantidade "$POSTS" --intervalo "$INTERVALO"
          else
            python publicar.py
          fi

      - name: Salvar a fila e o que já foi postado
        if: always()
        run: |
          git config user.name "babybot"
          git config user.email "babybot@users.noreply.github.com"
          git add estado/*.json estado/*.txt listas/*.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "estado: rodada ${{ github.run_number }}"
            git pull --rebase --quiet && git push
          fi
